apiVersion: apps/v1
kind: Deployment
metadata:
  name: treasure-jhoan
  namespace: treasure-hunt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: treasure-jhoan
  template:
    metadata:
      labels:
        app: treasure-jhoan
    spec:
      containers:
        - name: web
          image: mausterl26/treasure-new
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "Treasure Hunt — jhoan"
            - name: STUDENT
              value: "jhoan sebastian rivera"
            - name: SALT
              value: "DS3univalle"
            - name: KEY_HASH
              value: "52c00cf2c46859bf118b63b99aa6b23498d7ee45a2a0b6eb051067e35aa95fe4"
            - name: CLUE
              valueFrom:
                secretKeyRef:
                  name: jhoan-clue
                  key: CLUE
---
apiVersion: v1
kind: Service
metadata:
  name: treasure-jhoan
  namespace: treasure-hunt
spec:
  selector:
    app: treasure-jhoan
  ports:
    - name: http
      port: 80
      targetPort: 80
      # nodePort: 31080   # (opcional) fija uno en el rango 30000–32767
  type: NodePort


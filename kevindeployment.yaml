apiVersion: apps/v1
kind: Deployment
metadata:
  name: treasure-kevin
  namespace: treasure-hunt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: treasure-kevin
  template:
    metadata:
      labels:
        app: treasure-kevin
    spec:
      containers:
        - name: web
          image: kevinprado2024/treasure-new
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "Treasure Hunt — kevin"
            - name: STUDENT
              value: "Kevin Andres Prado"
            - name: SALT
              value: "DS3univalle"
            - name: KEY_HASH
              value: "0226d06893b7f4ec8b1299a7dad3573e296ed74c145ad6c292b16d0627f51b48"
            - name: CLUE
              valueFrom:
                secretKeyRef:
                  name: kevin-clue
                  key: CLUE
---
apiVersion: v1
kind: Service
metadata:
  name: treasure-kevin
  namespace: treasure-hunt
spec:
  selector:
    app: treasure-kevin
  ports:
    - name: http
      port: 80
      targetPort: 80
      # nodePort: 31080   # (opcional) fija uno en el rango 30000–32767
  type: NodePort

